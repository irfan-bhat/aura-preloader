name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version in plugin file
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          # Update main plugin file
          sed -i "s/Version:     [0-9.]\+/Version:     $version/" aura-preloader.php
          sed -i "s/define( 'AURA_VERSION',  '[0-9.]\+'/define( 'AURA_VERSION',  '$version'/" aura-preloader.php
          sed -i "s/Aura Preloader v[0-9.]\+/Aura Preloader v$version/" aura-preloader.php
          # Keep readme.txt Stable tag in sync (prevents WordPress.org stable_tag_mismatch)
          sed -i "s/Stable tag: [0-9.]\+/Stable tag: $version/" readme.txt
          # Update version badge / heading in readme.md
          sed -i "s/Version: [0-9.]\+/Version: $version/" readme.md

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add aura-preloader.php readme.txt readme.md
          git commit -m "chore: bump version to ${GITHUB_REF#refs/tags/v}"
          git push origin HEAD:main

      - name: Create release ZIP
        run: |
          version="${GITHUB_REF#refs/tags/}"
          mkdir -p release
          zip -r "release/aura-preloader-${version}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "release/*" \
            -x "node_modules/*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: release/aura-preloader-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
